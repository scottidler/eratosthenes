[package]
name = "eratosthenes"
version = "0.2.13"
edition = "2024"
authors = ["Your Name <your.email@example.com>"]
build = "build.rs"
description = "A CLI application generated by rust-scaffold"

[dependencies]
bytes = "1.11.1"
chrono = "0.4.44"
clap = { version = "4.6.0", features = ["derive"] }
colored = "3.1.1"
dirs = "6.0.0"
eyre = "0.6.12"
globset = "0.4.18"
google-gmail1 = "7.0.0"
http = "1.4.1"
http-body-util = "0.1.3"
hyper = "1.10.1"
hyper-rustls = "0.27.7"
hyper-util = "0.1.20"
log = { version = "0.4.29", features = ["std"] }
rustls = "0.23.37"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
tokio = { version = "1.50.0", features = ["full"] }
yup-oauth2 = "12.1.2"
# Dependencies will be added via cargo add

[build-dependencies]

[dev-dependencies]
tempfile = "3.27.0"
# For build.rs if needed
