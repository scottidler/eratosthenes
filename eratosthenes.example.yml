# ============================================================================
# eratosthenes - example configuration
# ============================================================================
# Copy this file to ~/.config/eratosthenes/<account>.yml and edit it. The
# account name is the filename stem (e.g. ~/.config/eratosthenes/work.yml ->
# account "work"). Discovery picks up every *.yml in that directory that has an
# `auth:` block, so multiple accounts can run side by side.
#
# Secrets are NEVER stored in this file: the OAuth client secret and token cache
# live next to it as separate files (see `creds-path`), and the Slack token is
# referenced by env-var NAME only (see `token-env`).
# ============================================================================

# ---- auth (REQUIRED) -------------------------------------------------------
auth:
  # Directory holding this account's OAuth2 `client-secret.json` (a Google Cloud
  # "Desktop app" client) and the generated `tokencache.json`. Relative paths
  # resolve under ~/.config/eratosthenes/. Give each account its own directory.
  creds-path: "~/.config/eratosthenes"
  # callback-port: 13131         # localhost port for the OAuth redirect (default)

# ---- slack (OPTIONAL) ------------------------------------------------------
# Present -> `eratosthenes digest` posts a Slack summary of the pinned
# (Starred + Important) inbox, and `service install` lays down a systemd timer
# driven by `schedule` below. Omit the whole block to disable the digest.
slack:
  # NAME of the env var holding your Slack USER token (xoxp-...), never the token
  # itself. `service install` copies the value into
  # ~/.config/eratosthenes/digest.env (mode 600) for the timer to read. A user
  # token (not a bot token) is required to post into your own self-DM.
  token-env: SLACK_XOXP_TOKEN

  # REQUIRED (when this block is present). Where the digest is posted. Use the
  # Slack *ID*, not a #name:
  #   Dxxxx - your self-DM ("note to self"); only your own xoxp token posts here
  #   Uxxxx - a DM to another user
  #   Cxxxx - a public/private channel the token can write to
  # Grab an ID from the conversation's "Copy link" in Slack.
  channel: D0XXXXXXXXX

  # Gmail multi-login slot (the /u/N in mail.google.com/mail/u/N) used to build
  # the digest's deep links. 0 = your first signed-in account.
  browser-index: 0

  # REQUIRED. systemd OnCalendar string driving the digest timer (system local
  # time). There is NO default: omit it and the config fails to parse, by design,
  # so a silent fallback can never clobber the installed timer. Validated at
  # `service install` via `systemd-analyze calendar`. Examples:
  #   Mon,Thu 07:00:00     - Mon & Thu at 7am
  #   Mon-Fri 08,13:00:00  - weekdays at 8am and 1pm
  #   *-*-* 09:00:00       - every day at 9am
  schedule: Mon,Thu 07:00:00

# ---- triage (OPTIONAL) ------------------------------------------------------
# LLM classification pass in front of the aging engine (design doc:
# docs/design/2026-07-06-llm-triage.md). Present -> `eratosthenes triage`
# buckets new inbox threads via Gmail labels, and `service install` lays down a
# triage timer driven by `schedule` below. Omit the whole block to disable it.
# KEYLESS by construction: the LLM call shells out to the locally installed
# `claude` CLI, which owns its own auth. This config holds no Anthropic
# credential.
# triage:
#   # Path to the `claude` binary. Optional; resolved on PATH if unset. A
#   # systemd unit's PATH is not your shell's -- `service install` extends the
#   # generated unit PATH to cover it (Phase 5).
#   claude-binary: ~/.local/bin/claude
#
#   # REQUIRED (when this block is present), same reasoning as slack.schedule:
#   # there is NO default, so a missing schedule fails to load rather than
#   # silently guessing a cadence and clobbering the installed timer.
#   schedule: "Mon..Fri 06:30:00"
#
#   # Per-run cap on candidate threads. Hitting it logs loudly and never
#   # truncates silently; the remainder is picked up next run. Default: 50
#   max-threads: 50
#
#   # Per-THREAD char budget for body extraction, newest messages first.
#   # Default: 4000
#   body-chars: 4000
#
#   # Model for the batched classify call. Default: claude-haiku-4-5-20251001
#   classify-model: claude-haiku-4-5-20251001
#
#   # Model for reply-draft generation (Phase 7). Default: claude-sonnet-5
#   draft-model: claude-sonnet-5
#
#   # Path to your voice profile, consumed by draft prompts only (Phase 7). No
#   # default: drafting is skipped loudly if unset.
#   voice-profile: ~/Claude/writing/VOICE.md
#
#   # Classification taxonomy: names, labels, and the descriptions that become
#   # the classifier prompt. Adding a bucket = YAML edit. Each bucket label
#   # needs a matching state-filters entry below (needs-reply -> Keep, etc.).
#   # `label` is REQUIRED per bucket; a bucket missing it fails to load,
#   # naming the offending bucket and field. Defaults to the five buckets
#   # below if `buckets` is omitted entirely.
#   buckets:
#     - name: needs-reply
#       label: llm/needs-reply
#       description: a real human wrote to Scott and expects a reply or action
#       draft: true
#     - name: fyi-work
#       label: llm/fyi-work
#       description: work-relevant notifications -- AWS, security, CI, vendors
#     - name: recruiting
#       label: llm/recruiting
#       description: LinkedIn, recruiters, job alerts
#     - name: receipts
#       label: llm/receipts
#       description: invoices, payments, renewals, order confirmations
#     - name: noise
#       label: llm/noise
#       description: everything else -- marketing, newsletters, social

# ---- marker-label (OPTIONAL) -----------------------------------------------
# The label a message-filter stamps on every message it HANDLES (whether or not
# the action changed anything), so unstarring/un-flagging it later STICKS: the
# marker excludes the message from every filter forever after. Defaults to
# `Triaged` if omitted, so no config change is required to adopt it. Must not
# name any state-filter label or destination (Purgatory/Oblivion/etc. below),
# or stage sanitization would strip it right back off. To reset (re-consider
# every message from scratch), delete this label in the Gmail UI by hand.
# marker-label: Triaged

# ---- message-filters -------------------------------------------------------
# Applied to INCOMING messages as they are classified. Each entry is keyed by a
# unique name; ALL of its conditions must match (logical AND); first match wins.
# Address fields accept a single glob, a list of globs, or an empty list `[]`
# meaning "this field must be empty". Glob syntax: '*' matches anything.
#   to / cc / from : match recipients/senders   (cc: []  ==  "no CC at all")
#   subject        : list of globs matched against the subject line
#   label          : Gmail label(s) the message must already carry
#   headers        : map of header -> globs;  `[]`  ==  "this header must be ABSENT"
#   action         : Star | Flag | <LabelName> (moves to that label); list ok
message-filters:
  # VIP: sent only to me, no CC, by someone at my company -> Star it.
  - only-me-star:
      to: ['you@example.com']
      cc: []                     # must have no CC
      from: '*@example.com'
      headers:
        List-Id: []              # skip mailing-list mail (List-Id header absent)
      label: INBOX
      action: Star

  # Anything else sent directly to me by a colleague -> Flag (mark Important).
  - only-me:
      to: ['you@example.com']
      from: '*@example.com'
      label: INBOX
      action: Flag

# ---- state-filters ---------------------------------------------------------
# Applied to EXISTING messages on every run, in the order listed, to age the
# inbox toward zero. Each entry is keyed by a unique name.
#   label : Gmail label(s) this rule applies to; omit/empty = all messages
#   ttl   : "Keep" (never expire)  |  "<n>d" (e.g. 7d)  |
#           { read: <n>d, unread: <n>d }  (separate ages for read vs unread)
#   action: <LabelName> or { Move: <LabelName> } to relabel; { Delete } to trash
state-filters:
  # Protect anything Starred or Important - never age it off.
  - Starred:
      labels: [Important, Starred]
      ttl: Keep

  - Important:
      label: Important
      ttl: Keep

  # ---- llm/* bucket filters (OPTIONAL, only if `triage:` above is enabled) --
  # One state-filter per bucket, keyed to that bucket's label. These MUST
  # precede Cull below: Cull matches every INBOX thread on its own TTL
  # regardless of label, so a bucket filter placed after it never gets a
  # chance to apply its own (tighter or looser) TTL first. `llm/seen`
  # deliberately gets no state-filter of its own.

  # needs-reply is fully protected until answered. The engine removes
  # llm/needs-reply once a reply goes out, at which point the thread falls
  # through to Cull like anything else.
  - keep-needs-reply:
      label: llm/needs-reply
      ttl: Keep

  - age-fyi-work:
      label: llm/fyi-work
      ttl:
        read: 3d
        unread: 7d
      action: Purgatory

  - age-recruiting:
      label: llm/recruiting
      ttl: 3d
      action: Purgatory

  # Kept a bit longer than the other buckets for reference.
  - age-receipts:
      label: llm/receipts
      ttl: 7d
      action: Purgatory

  # Ages off fastest of all buckets.
  - age-noise:
      label: llm/noise
      ttl: 1d
      action: Purgatory

  # Cull the inbox: read mail after 7d, unread after 21d -> move to Purgatory.
  - Cull:
      ttl:
        read: 7d
        unread: 21d
      action: Purgatory

  # Purgatory drains to Oblivion (trash) after 3 more days.
  - Purge:
      label: Purgatory
      ttl: 3d
      action:
        Move: Oblivion
